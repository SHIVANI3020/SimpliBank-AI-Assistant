name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile
        run: javac -d out -cp "lib/mysql-connector-j-26.7.0.jar:lib/junit-platform-console-standalone-6.1.3.jar:lib/json-20260814.jar" src/bank/*.java